<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Niural Dev Tools</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        padding: 12px;
        min-width: 380px;
        font: 13px/1.4 ui-sans-serif, system-ui, sans-serif;
      }
      h1 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; opacity: .6; }
      .row { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
      .label { flex: 0 0 92px; opacity: .6; }
      .value { flex: 1; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
      button { flex: 0 0 auto; cursor: pointer; border-radius: 4px; border: 1px solid currentColor; background: transparent; color: inherit; padding: 2px 8px; font-size: 11px; }
      .empty { opacity: .6; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
